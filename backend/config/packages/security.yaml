security:

    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: bcrypt
            cost: 13

    providers:
        jwt_provider:
            id: App\Infrastructure\Security\JWTUserProvider

    firewalls:

        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # Route de login gérée par LexikJWT
        login:
            pattern: ^/api/auth/login
            stateless: true
            json_login:
                check_path: /api/auth/login
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
                username_path: email
                password_path: password

        # API — protégée par JWT
        api:
            pattern: ^/api
            stateless: true
            jwt: ~

    access_control:
        - { path: ^/api/auth/login,    roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/books$,        methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/api/books/\w+$,    methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/api/books/\w+/(borrow|return), roles: ROLE_USER }
        - { path: ^/api/books$,        methods: [POST], roles: ROLE_LIBRARIAN }
        - { path: ^/api/auth/me,       roles: ROLE_USER }

    role_hierarchy:
        ROLE_LIBRARIAN: [ROLE_USER]
        ROLE_ADMIN:     [ROLE_LIBRARIAN, ROLE_USER]

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
